# File: .github/workflows/ci.yml
# ============================================================
# BusinessSAAS — CI Workflow
# ============================================================
# Runs on:
#   - push to main or develop
#   - pull_request targeting main or develop
#
# Jobs (backend, integration, and frontend run in parallel; docker waits on all three):
#   backend      → vet, unit tests, build
#   integration  → integration tests against real Postgres + Redis
#   frontend     → lint, type-check, build
#   docker       → build both Docker images (no push)
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Backend — Go/Fiber (unit tests only — no DB required)
  # ----------------------------------------------------------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race ./internal/tests/unit/
        # Integration tests run in the separate `integration` job below
        # (they need a live Postgres/Redis, which this job doesn't have).

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -trimpath \
            -o ./bin/businesssaas \
            ./cmd/server

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/businesssaas
          retention-days: 1

  # ----------------------------------------------------------
  # Backend Integration Tests — real Postgres + Redis
  # ----------------------------------------------------------
  integration:
    name: Backend (Integration Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_password
          POSTGRES_DB: businesssaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION: "1"
      DATABASE_URL: postgres://saas_user:saas_password@localhost:5432/businesssaas_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations against test database
        run: |
          goose -dir internal/migrations postgres \
            "postgres://saas_user:saas_password@localhost:5432/businesssaas_test?sslmode=disable" \
            up

      - name: Run integration tests
        run: go test -v -race -cover ./internal/tests/integration/...

  # ----------------------------------------------------------
  # Frontend — Next.js / Bun
  # ----------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: bun run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: bun run type-check

      - name: Build Next.js application
        working-directory: frontend
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_APP_NAME: BusinessSAAS
          BACKEND_INTERNAL_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: 1

  # ----------------------------------------------------------
  # Docker Build — validate both images build successfully
  # Does NOT push images anywhere yet.
  # ----------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, integration, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: businesssaas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: businesssaas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
            NEXT_PUBLIC_APP_NAME=BusinessSAAS
            NEXT_TELEMETRY_DISABLED=1