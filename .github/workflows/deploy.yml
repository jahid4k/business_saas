name: Deploy

on:
  # Manual trigger only — until VPS is configured
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        type: string

  # Future: auto-deploy on push to main after CI passes
  # Uncomment when VPS is ready:
  # push:
  #   branches:
  #     - main

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # Guard — validate manual confirmation
  # ----------------------------------------------------------
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Deployment not confirmed. Type DEPLOY to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed for: ${{ github.event.inputs.environment }}"

