version: "3.9"

# ============================================================
# BusinessSAAS — Root Docker Compose
# ============================================================
# Services:
#   postgres  — PostgreSQL 16 primary database
#   redis     — Redis 7 cache + rate limiting
#   backend   — Go/Fiber API server
#   frontend  — Next.js dashboard
#
# Usage:
#   docker compose up --build          (foreground, rebuild images)
#   docker compose up -d --build       (detached)
#   docker compose down                (stop, keep volumes)
#   docker compose down -v             (stop, delete volumes + data)
#   docker compose logs -f backend     (tail backend logs)
#   docker compose logs -f frontend    (tail frontend logs)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: businesssaas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas_password}
      POSTGRES_DB: ${POSTGRES_DB:-businesssaas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - saas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_user} -d ${POSTGRES_DB:-businesssaas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: businesssaas_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-saas_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - saas_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-saas_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------
  # Backend — Go/Fiber API
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: businesssaas_backend
    restart: unless-stopped
    environment:
      # App
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      APP_NAME: BusinessSAAS

      # Database — uses Docker service name "postgres" as host
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-saas_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-saas_password}
      DATABASE_NAME: ${POSTGRES_DB:-businesssaas}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 5
      DATABASE_CONN_MAX_LIFETIME: 300

      # Redis — uses Docker service name "redis" as host
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-saas_redis_password}
      REDIS_DB: 0

      # JWT
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_min_32_chars}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Cookie
      COOKIE_NAME: ${COOKIE_NAME:-bsaas_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_PATH: ${COOKIE_PATH:-/api/v1/auth}

      # Frontend URL (used for redirects, CORS, etc.)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      # Mount source for live reload with Air
      - ./backend:/app
    networks:
      - saas_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Frontend — Next.js dashboard
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: businesssaas_frontend
    restart: unless-stopped
    environment:
      # Server-side URL: Next.js server → backend (inside Docker network)
      BACKEND_INTERNAL_URL: http://backend:8080

      # Client-side URL: browser → backend (must be reachable from user's machine)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

      # App name
      NEXT_PUBLIC_APP_NAME: BusinessSAAS

      # next-auth v5 — required or login will silently fail
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_this_nextauth_secret_min_32_chars}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      NODE_ENV: development
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      # Mount source for Next.js fast refresh
      - ./frontend:/app
      # Prevent host node_modules from shadowing container
      - /app/node_modules
      - /app/.next
    networks:
      - saas_net
    depends_on:
      backend:
        condition: service_healthy

# ----------------------------------------------------------
# Named Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  saas_net:
    driver: bridge
    name: businesssaas_network